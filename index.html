<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de Crédit Immobilier</title>

<style>
:root {
    --primary: #3498db;
    --primary-dark: #2980b9;
    --success: #27ae60;
    --bg: #f4f6f8;
    --text: #2c3e50;
    --muted: #7f8c9a;
}

* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 15px;
    color: var(--text);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

/* Onglets */
.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 25px;
    background: var(--bg);
    padding: 6px;
    border-radius: 12px;
}

.tab-btn {
    flex: 1;
    padding: 12px 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.tab-btn.active {
    background: #fff;
    color: var(--primary-dark);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.tab-panel {
    display: none;
}

.tab-panel.active {
    display: block;
}

.section {
    margin-bottom: 25px;
}

.section h3 {
    margin-bottom: 15px;
    border-bottom: 2px solid var(--primary);
    padding-bottom: 5px;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

label {
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: var(--primary);
}

button.calculer {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    background: var(--success);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
}

button.calculer:hover {
    opacity: 0.9;
}

.results {
    margin-top: 25px;
    background: #ecf6ff;
    border-radius: 12px;
    padding: 20px;
    display: none;
}

.result-item {
    margin: 8px 0;
    font-size: 16px;
}

.highlight {
    margin-top: 15px;
    background: #dff9fb;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.print-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    background: #fff;
    color: var(--primary-dark);
    border: 2px solid var(--primary);
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
    display: none;
}

.print-btn.visible {
    display: block;
}

.print-btn:hover {
    background: #eaf4fc;
}

@media print {
    @page {
        size: A4;
        margin: 10mm;
    }

    body {
        padding: 0;
        background: #fff;
    }

    h1 {
        font-size: 20px;
        margin-bottom: 10px;
    }

    .container {
        max-width: 100%;
        padding: 0;
        box-shadow: none;
        border-radius: 0;
    }

    .tabs,
    button.calculer,
    .print-btn {
        display: none !important;
    }

    .section {
        margin-bottom: 10px;
    }

    .section h3 {
        font-size: 14px;
        margin-bottom: 8px;
        padding-bottom: 3px;
    }

    .form-grid {
        gap: 6px;
    }

    label {
        font-size: 11px;
    }

    input {
        padding: 4px 6px;
        margin-top: 2px;
        font-size: 12px;
        border: none;
        border-bottom: 1px solid #ccc;
        border-radius: 0;
        color: var(--text);
        background: transparent;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .results {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #dce7ef;
    }

    .result-item {
        margin: 4px 0;
        font-size: 13px;
    }

    .highlight {
        margin-top: 8px;
        padding: 10px;
        font-size: 18px;
    }
}
</style>
</head>

<body>

<h1>🏠 Simulateur de Crédit Immobilier</h1>

<div class="container">

    <div class="tabs">
        <button class="tab-btn active" id="tabBtn1" onclick="switchTab(1)">💶 Prix du bien</button>
        <button class="tab-btn" id="tabBtn2" onclick="switchTab(2)">📆 Mensualités</button>
    </div>

    <!-- ONGLET 1 : à partir de la mensualité, trouver le prix du bien -->
    <div class="tab-panel active" id="tabPanel1">

        <div class="section">
            <h3>📄 Paramètres du prêt</h3>
            <div class="form-grid">
                <div>
                    <label>Mensualité de crédit, hors assurance (€)</label>
                    <input type="number" id="mensualite" value="1870">
                </div>
                <div>
                    <label>Durée (années)</label>
                    <input type="number" id="annees" value="25">
                </div>
                <div>
                    <label>Taux du crédit (%)</label>
                    <input type="number" step="0.01" id="tauxCredit" value="3.65">
                </div>
                <div>
                    <label>Assurance mensuelle (€)</label>
                    <input type="number" id="assurance" value="80">
                </div>
            </div>
        </div>

        <div class="section">
            <h3>💰 Apport et frais</h3>
            <div class="form-grid">
                <div>
                    <label>Apport personnel (€)</label>
                    <input type="number" id="apport" value="80000">
                </div>
                <div>
                    <label>Frais de dossier (€)</label>
                    <input type="number" id="dossier" value="1000">
                </div>
                <div>
                    <label>Frais de garantie (€)</label>
                    <input type="number" id="garantie" value="4000">
                </div>
            </div>
        </div>

        <div class="section">
            <h3>🏛️ Frais de notaire</h3>
            <div class="form-grid">
                <div>
                    <label>Taux de notaire (%)</label>
                    <input type="number" step="0.2" id="tauxNotaire" value="7">
                </div>
            </div>
        </div>

        <button class="calculer" onclick="calculerPrix()">Lancer la simulation</button>

        <div class="results" id="resultats1">
            <div class="result-item" id="capital"></div>
            <div class="result-item" id="interets1"></div>
            <div class="result-item" id="notaire1"></div>
            <div class="result-item" id="frais1"></div>
            <div class="result-item" id="mensualiteAvecAssurance1"></div>
            <div class="highlight" id="prixBien"></div>
        </div>

        <button class="print-btn" id="printBtn1" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>

    </div>

    <!-- ONGLET 2 : à partir du prix du bien, trouver la mensualité -->
    <div class="tab-panel" id="tabPanel2">

        <div class="section">
            <h3>🏠 Le bien</h3>
            <div class="form-grid">
                <div>
                    <label>Prix du bien (€)</label>
                    <input type="number" id="prixBienInput" value="430000">
                </div>
                <div>
                    <label>Apport personnel (€)</label>
                    <input type="number" id="apport2" value="80000">
                </div>
            </div>
        </div>

        <div class="section">
            <h3>📄 Paramètres du prêt</h3>
            <div class="form-grid">
                <div>
                    <label>Durée (années)</label>
                    <input type="number" id="annees2" value="25">
                </div>
                <div>
                    <label>Taux du crédit (%)</label>
                    <input type="number" step="0.01" id="tauxCredit2" value="3.65">
                </div>
                <div>
                    <label>Assurance mensuelle (€)</label>
                    <input type="number" id="assurance2" value="80">
                </div>
            </div>
        </div>

        <div class="section">
            <h3>💰 Frais annexes</h3>
            <div class="form-grid">
                <div>
                    <label>Taux de notaire (%)</label>
                    <input type="number" step="0.2" id="tauxNotaire2" value="7.2">
                </div>
                <div>
                    <label>Frais de dossier (€)</label>
                    <input type="number" id="dossier2" value="1000">
                </div>
                <div>
                    <label>Frais de garantie (€)</label>
                    <input type="number" id="garantie2" value="4000">
                </div>
            </div>
        </div>

        <button class="calculer" onclick="calculerMensualite()">Lancer la simulation</button>

        <div class="results" id="resultats2">
            <div class="result-item" id="notaire2"></div>
            <div class="result-item" id="capitalEmprunte"></div>
            <div class="result-item" id="interets2"></div>
            <div class="result-item" id="mensualiteSansAssurance"></div>
            <div class="highlight" id="mensualiteTotale"></div>
        </div>

        <button class="print-btn" id="printBtn2" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>

    </div>

</div>

<script>
function format(n) {
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function switchTab(n) {
    document.getElementById("tabPanel1").classList.toggle("active", n === 1);
    document.getElementById("tabPanel2").classList.toggle("active", n === 2);
    document.getElementById("tabBtn1").classList.toggle("active", n === 1);
    document.getElementById("tabBtn2").classList.toggle("active", n === 2);
}

// ---- Onglet 1 : mensualité -> prix du bien ----
function calculerPrix() {
    const mensualite = parseFloat(document.getElementById("mensualite").value);
    const annees = parseInt(document.getElementById("annees").value);
    const tauxAnnuel = parseFloat(document.getElementById("tauxCredit").value) / 100;
    const assurance = parseFloat(document.getElementById("assurance").value);
    const apport = parseFloat(document.getElementById("apport").value);
    const dossier = parseFloat(document.getElementById("dossier").value);
    const garantie = parseFloat(document.getElementById("garantie").value);
    const tauxNotaire = parseFloat(document.getElementById("tauxNotaire").value) / 100;

    const n = annees * 12;
    const tauxMensuel = tauxAnnuel / 12;

    const mensualiteCredit = mensualite;
    const mensualiteAvecAssurance = mensualite + assurance;
    const capital = mensualiteCredit * (1 - Math.pow(1 + tauxMensuel, -n)) / tauxMensuel;

    const fraisFixes = dossier + garantie;
    const prixBien = (capital + apport - fraisFixes) / (1 + tauxNotaire);
    const fraisNotaire = prixBien * tauxNotaire;

    const totalVerse = mensualiteCredit * n;
    const interets = totalVerse - capital;

    document.getElementById("resultats1").style.display = "block";
    document.getElementById("capital").innerHTML = `💰 Capital empruntable : <strong>${format(capital)} €</strong>`;
    document.getElementById("interets1").innerHTML = `📈 Montant total des intérêts : <strong>${format(interets)} €</strong>`;
    document.getElementById("notaire1").innerHTML = `🏛️ Frais de notaire estimés : <strong>${format(fraisNotaire)} €</strong>`;
    document.getElementById("frais1").innerHTML = `📉 Frais fixes (dossier + garantie) : <strong>${format(fraisFixes)} €</strong>`;
    document.getElementById("mensualiteAvecAssurance1").innerHTML = `📆 Mensualité totale (assurance incluse) : <strong>${format(mensualiteAvecAssurance)} €</strong>`;
    document.getElementById("prixBien").innerHTML = `🏠 Prix du bien estimé : ${format(prixBien)} €`;
    document.getElementById("printBtn1").classList.add("visible");
}

// ---- Onglet 2 : prix du bien -> mensualité ----
function calculerMensualite() {
    const prixBien = parseFloat(document.getElementById("prixBienInput").value);
    const apport = parseFloat(document.getElementById("apport2").value);
    const annees = parseInt(document.getElementById("annees2").value);
    const tauxAnnuel = parseFloat(document.getElementById("tauxCredit2").value) / 100;
    const assurance = parseFloat(document.getElementById("assurance2").value);
    const tauxNotaire = parseFloat(document.getElementById("tauxNotaire2").value) / 100;
    const dossier = parseFloat(document.getElementById("dossier2").value);
    const garantie = parseFloat(document.getElementById("garantie2").value);

    const n = annees * 12;
    const tauxMensuel = tauxAnnuel / 12;

    const fraisNotaire = prixBien * tauxNotaire;
    const fraisFixes = dossier + garantie;
    const capitalEmprunte = prixBien + fraisNotaire + fraisFixes - apport;

    const mensualiteCredit = capitalEmprunte * tauxMensuel / (1 - Math.pow(1 + tauxMensuel, -n));
    const totalVerse = mensualiteCredit * n;
    const interets = totalVerse - capitalEmprunte;
    const mensualiteTotale = mensualiteCredit + assurance;

    document.getElementById("resultats2").style.display = "block";
    document.getElementById("notaire2").innerHTML = `🏛️ Frais de notaire estimés : <strong>${format(fraisNotaire)} €</strong>`;
    document.getElementById("capitalEmprunte").innerHTML = `💰 Capital à emprunter : <strong>${format(capitalEmprunte)} €</strong>`;
    document.getElementById("interets2").innerHTML = `📈 Montant total des intérêts : <strong>${format(interets)} €</strong>`;
    document.getElementById("mensualiteSansAssurance").innerHTML = `💳 Mensualité de crédit, hors assurance : <strong>${format(mensualiteCredit)} €</strong>`;
    document.getElementById("mensualiteTotale").innerHTML = `📆 Mensualité totale (assurance incluse) : ${format(mensualiteTotale)} €`;
    document.getElementById("printBtn2").classList.add("visible");
}
</script>

</body>
</html>
